<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#00DFD8"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#39D353"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 44px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; letter-spacing: 1px; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #c9d1d9; }
    
    /* Subtle Dynamic Animations in background */
    @keyframes pulse-glow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes float-nodes {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes scanline {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .anim-glow { animation: pulse-glow 6s infinite ease-in-out; transform-origin: center; }
    .anim-float { animation: float-nodes 8s infinite ease-in-out; }
    .scan-path { stroke-dasharray: 20 10; animation: scanline 20s linear infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Background Decorative Dynamic Elements (Behind Text) -->
  <g class="anim-glow">
    <circle cx="200" cy="80" r="140" fill="url(#glow-grad)" filter="url(#glow)" />
    <circle cx="1000" cy="220" r="160" fill="url(#glow-grad)" filter="url(#glow)" />
  </g>

  <!-- Grid Tech Lines (Background Layer) -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  <!-- Animated Connection Flows (Background Visual) -->
  <g class="anim-float">
    <path class="scan-path" d="M 100 240 Q 300 280 500 220 T 900 260 T 1150 200" fill="none" stroke="#58A6FF" stroke-opacity="0.25" stroke-width="2" />
    <path class="scan-path" d="M 50 80 Q 350 20 650 90 T 1100 40" fill="none" stroke="#FF0080" stroke-opacity="0.2" stroke-width="2" />
    
    <!-- Abstract Browser / Node Badges floating in background -->
    <rect x="920" y="45" width="180" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" fill-opacity="0.8"/>
    <circle cx="940" cy="65" r="5" fill="#ff5f56"/>
    <circle cx="955" cy="65" r="5" fill="#ffbd2e"/>
    <circle cx="970" cy="65" r="5" fill="#27c93f"/>
    <rect x="940" y="82" width="140" height="8" rx="4" fill="#30363d"/>
    <rect x="940" y="98" width="90" height="8" rx="4" fill="#58A6FF" opacity="0.6"/>

    <rect x="840" y="165" width="220" height="95" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" fill-opacity="0.8"/>
    <circle cx="860" cy="185" r="5" fill="#ff5f56"/>
    <circle cx="875" cy="185" r="5" fill="#ffbd2e"/>
    <circle cx="890" cy="185" r="5" fill="#27c93f"/>
    <rect x="860" y="202" width="180" height="8" rx="4" fill="#30363d"/>
    <rect x="860" y="218" width="120" height="8" rx="4" fill="#BC8CFF" opacity="0.6"/>
    <rect x="860" y="234" width="70" height="8" rx="4" fill="#39D353" opacity="0.6"/>
  </g>

  <!-- Bottom Accent Ribbon Bar -->
  <rect x="0" y="294" width="1200" height="6" fill="url(#accent-grad)" />

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and clarity) -->
  <g transform="translate(60, 0)">
    <!-- Icon / Symbol -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#1f242d" stroke="#30363d" stroke-width="2"/>
      <path d="M 16 18 L 40 18 C 42 18 44 20 44 22 L 44 38 C 44 40 42 42 40 42 L 16 42 C 14 42 12 40 12 38 L 12 22 C 12 20 14 18 16 18 Z" fill="none" stroke="#58A6FF" stroke-width="2.5"/>
      <circle cx="18" cy="24" r="2" fill="#FF0080"/>
      <circle cx="24" cy="24" r="2" fill="#FFBD2E"/>
      <circle cx="30" cy="24" r="2" fill="#39D353"/>
      <path d="M 20 32 L 26 36 L 20 40" fill="none" stroke="#00DFD8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="29" y1="40" x2="36" y2="40" stroke="#58A6FF" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Main Title -->
    <text x="76" y="115" class="title">Awesome Browser Automation Platform</text>
    
    <!-- Subtitle -->
    <text x="76" y="152" class="subtitle">Cloud Browser Infrastructure ⚡ AI Agent Execution ⚡ Anti-Detect Stealth</text>

    <!-- Pillar Pill Badges in Foreground -->
    <g transform="translate(76, 185)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="5" fill="#58A6FF"/>
      <text x="35" y="22" class="badge-text">☁️ Cloud Infrastructure</text>

      <!-- Pill 2 -->
      <rect x="195" y="0" width="165" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="215" cy="17" r="5" fill="#BC8CFF"/>
      <text x="230" y="22" class="badge-text">🤖 AI Agent APIs</text>

      <!-- Pill 3 -->
      <rect x="375" y="0" width="190" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="395" cy="17" r="5" fill="#39D353"/>
      <text x="410" y="22" class="badge-text">🥷 Anti-Detect Evasion</text>
    </g>
  </g>
</svg>
